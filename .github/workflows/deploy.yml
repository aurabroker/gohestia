name: Deploy to Cloudflare

# Auto-deploy na Cloudflare (OpenNext) po każdym pushu do `main`.
# Można też uruchomić ręcznie z zakładki Actions (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nie pozwól na równoległe deploye tej samej gałęzi.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Token wyłącznie z Secrets: wartości z Variables nie są maskowane
      # w logach, a logi Actions publicznego repozytorium są publiczne.
      # Identyfikator konta nie jest sekretem, więc może leżeć w Variables.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight — sprawdź poświadczenia (bez ujawniania wartości)
        env:
          TOK_S: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOK_V: ${{ vars.CLOUDFLARE_API_TOKEN }}
          ACC_S: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACC_V: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          chk() { if [ -n "$2" ]; then echo "$1: SET (dł. ${#2})"; else echo "$1: BRAK"; fi; }
          echo "── Gdzie są poświadczenia? ──"
          chk "CLOUDFLARE_API_TOKEN  (Secrets)  " "$TOK_S"
          chk "CLOUDFLARE_API_TOKEN  (Variables)" "$TOK_V"
          chk "CLOUDFLARE_ACCOUNT_ID (Secrets)  " "$ACC_S"
          chk "CLOUDFLARE_ACCOUNT_ID (Variables)" "$ACC_V"
          if [ -z "$TOK_S" ] && [ -n "$TOK_V" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN jest w Variables, a musi być w Secrets. Przenieś go: Settings → Secrets and variables → Actions → zakładka Secrets (nazwa dokładnie CLOUDFLARE_API_TOKEN), a wpis z zakładki Variables usuń. Najlepiej przy okazji wygeneruj nowy token w Cloudflare."
            exit 1
          fi
          if [ -z "$TOK_S" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN nie znaleziony w Secrets repo. Dodaj go w Settings → Secrets and variables → Actions → zakładka Secrets, o nazwie dokładnie CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if [ -n "$TOK_V" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN jest też w Variables. Usuń ten wpis — wystarczy kopia w Secrets."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Wrangler v4 (używany przez opennextjs-cloudflare deploy) wymaga Node >= 22.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deploy używa wrangler pod spodem — czyta CLOUDFLARE_API_TOKEN i
      # CLOUDFLARE_ACCOUNT_ID z env ustawionego na poziomie job.
      # Sekrety runtime (RESEND_API_KEY, AGENT_EMAIL, TURNSTILE_SECRET_KEY,
      # FROM_EMAIL) są po stronie Cloudflare i deploy ich nie kasuje.
      - name: Build & deploy (OpenNext → Cloudflare)
        run: npm run deploy
